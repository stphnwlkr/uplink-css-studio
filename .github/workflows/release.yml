name: Publish plugin release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Validate the release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          grep -Fq "Version: ${RELEASE_VERSION}" uplink-css-studio.php
          grep -Fq "const VERSION = '${RELEASE_VERSION}';" uplink-css-studio.php
          grep -Fq "Stable tag: ${RELEASE_VERSION}" readme.txt
          python3 - <<'PY'
          import json, os
          version = os.environ['RELEASE_VERSION']
          with open('update.json') as file:
              metadata = json.load(file)
          assert metadata['version'] == version
          assert metadata['download_url'] == f'https://github.com/stphnwlkr/uplink-css-studio/releases/download/{version}/uplink-css-studio.zip'
          PY

      - name: Check layout regressions
        run: |
          node --check assets/js/studio.js
          node tests/layout-regression.cjs
          php -l uplink-css-studio.php

      - name: Build the installable ZIP
        run: |
          mkdir -p build/uplink-css-studio
          rsync -a ./ build/uplink-css-studio/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'assets/images/' \
            --exclude 'tests/' \
            --exclude 'build/' \
            --exclude '*.zip'
          cd build
          zip -qr ../uplink-css-studio.zip uplink-css-studio
          cd ..
          unzip -t uplink-css-studio.zip

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_VERSION}" uplink-css-studio.zip \
            --title "Uplink CSS Studio ${RELEASE_VERSION}" \
            --generate-notes \
            --verify-tag
